<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fortnightly House Roster</title>

  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #1f4fd8;
      --primary-dark: #153aa0;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #dbe3ef;
      --success: #16a34a;
      --warning: #f59e0b;
      --danger: #dc2626;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: linear-gradient(135deg, #153aa0, #2563eb);
      color: white;
      padding: 34px 28px;
      border-bottom-left-radius: 28px;
      border-bottom-right-radius: 28px;
      box-shadow: var(--shadow);
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    header p { margin: 0; opacity: 0.9; }

    .container {
      max-width: 1900px;
      margin: -24px auto 40px;
      padding: 0 22px;
    }

    .toolbar {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto auto;
      gap: 14px;
      align-items: end;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input, select, button {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 14px;
      background: white;
    }

    button {
      border: none;
      background: var(--primary);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: var(--primary-dark); }

    .secondary-btn {
      background: #eef2ff;
      color: var(--primary-dark);
      border: 1px solid #c7d2fe;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .tab-btn {
      width: auto;
      padding: 12px 16px;
      background: #ffffff;
      color: var(--primary-dark);
      border: 1px solid #c7d2fe;
      box-shadow: var(--shadow);
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
    }

    .cover-panel {
      display: none;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      margin-bottom: 22px;
    }

    .cover-panel.active { display: block; }

    .cover-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }

    .cover-item {
      border: 1px solid #fecaca;
      background: #fff7f7;
      border-radius: 14px;
      padding: 12px;
    }

    .cover-item strong { display: block; margin-bottom: 4px; }
    .cover-item span { display: block; color: var(--muted); font-size: 13px; }

    .empty-cover {
      padding: 16px;
      border-radius: 14px;
      background: #dcfce7;
      color: #166534;
      font-weight: 700;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 22px;
    }

    .stat-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .stat-card span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .stat-card strong { font-size: 26px; }

    .house-card {
      background: var(--card);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 24px;
    }

    .house-header {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      color: white;
    }

    .house-header h2 { margin: 0; }

    .tussock { background: linear-gradient(135deg, #047857, #10b981); }
    .silverglade { background: linear-gradient(135deg, #475569, #94a3b8); }
    .currant { background: linear-gradient(135deg, #9f1239, #e11d48); }
    .gilston-a { background: linear-gradient(135deg, #7c2d12, #f97316); }
    .gilston-b { background: linear-gradient(135deg, #3730a3, #6366f1); }

    .roster-table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 2200px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #eef2f7;
      border-right: 1px solid #eef2f7;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f8fafc;
      color: #475569;
      font-size: 12px;
      text-transform: uppercase;
      text-align: center;
    }

    .week-break { border-left: 4px solid #2563eb; }

    th:first-child, td:first-child {
      position: sticky;
      left: 0;
      background: #ffffff;
      z-index: 2;
      min-width: 185px;
      font-weight: 700;
    }

    th:first-child { background: #f8fafc; }

    .shift-name {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .shift-time {
      display: inline-flex;
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #eef2ff;
      color: #3730a3;
    }

    .short-time { background: #fef3c7; color: #92400e; }
    .day-time { background: #dcfce7; color: #166534; }
    .night-time { background: #e0e7ff; color: #312e81; }

    .cell-box {
      display: grid;
      gap: 7px;
      min-width: 145px;
    }

    .cell-box input, .cell-box select {
      padding: 8px 9px;
      border-radius: 9px;
      font-size: 13px;
    }

    .status-covered { color: var(--success); background: #dcfce7; font-weight: 700; }
    .status-vacant { color: var(--danger); background: #fee2e2; font-weight: 700; }
    .status-pending { color: var(--warning); background: #fef3c7; font-weight: 700; }

    .actions {
      display: flex;
      gap: 10px;
      padding: 16px 20px 20px;
      border-top: 1px solid #eef2f7;
      background: #fbfdff;
      flex-wrap: wrap;
    }

    .actions button { width: auto; }

    .footer-note {
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 1050px) {
      .toolbar, .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Fortnightly House Roster</h1>
    <p>Two-week roster by house, day and shift.</p>
  </header>

  <main class="container">
    <section class="toolbar">
      <div>
        <label for="fortnightStart">Fortnight Starting</label>
        <input id="fortnightStart" type="date" onchange="setFortnightStart(this.value)" />
      </div>

      <div>
        <label for="houseFilter">View House</label>
        <select id="houseFilter" onchange="renderRoster()">
          <option value="All">All Houses</option>
          <option value="Tussock">Tussock</option>
          <option value="Silverglade">Silverglade</option>
          <option value="Currant">Currant</option>
          <option value="159A Gilston">159A Gilston</option>
          <option value="159B Gilston">159B Gilston</option>
        </select>
      </div>

      <div>
        <label for="quickStaff">Quick Staff Name</label>
        <select id="quickStaff">
          <option value="">Select staff name</option>
        </select>
      </div>

      <button onclick="window.print()">Print / Save PDF</button>
      <button class="secondary-btn" onclick="clearRoster()">Clear Fortnight</button>
    </section>

    <section class="tabs">
      <button class="tab-btn active" id="rosterTab" onclick="showTab('roster')">Roster View</button>
      <button class="tab-btn" id="coverTab" onclick="showTab('cover')">Shifts Needing Cover <span id="coverCount">0</span></button>
    </section>

    <section class="cover-panel" id="coverPanel">
      <h2>Shifts Needing Cover</h2>
      <div id="coverList" class="cover-list"></div>
    </section>

    <section class="stats" id="statsPanel">
      <div class="stat-card"><span>Total Houses</span><strong>5</strong></div>
      <div class="stat-card"><span>Days Displayed</span><strong>14</strong></div>
      <div class="stat-card"><span>Standard Shifts</span><strong>Day + Sleepover</strong></div>
      <div class="stat-card"><span>159B Extra Short Shifts</span><strong>AM + PM</strong></div>
    </section>

    <section id="rosterArea"></section>

    <p class="footer-note">Tip: Select staff directly in each cell. Your roster saves automatically in this browser.</p>
  </main>

<script>
const dayNames = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

const employeeNames = [
  "Kylie Holloway",
  "Luke Bryant",
  "Tayla Holloway",
  "Chris Pagilaro",
  "Cheryl Wilson",
  "Caroline Scott",
  "Robert Tripp",
  "Anthony Murray",
  "Andrew Gordon",
  "Peter Suter",
  "Rebecca Butler",
  "Pamela Lawlor",
  "Sandra Jackson",
  "Ashika Prasad",
  "Laura hardie",
  "Genieve Cowley",
  "Kelly Ridings",
  "Sandra Harwood",
  "James Butler",
  "Amanda Hair",
  "Isabella Miokovich",
  "Lisa Fahey",
  "Sharon Adams",
  "Josephine Eyre-Walker",
  "Natalie Woodbury",
  "Nicole Mayo",
  "Alyssa Jesperson"
];

const fortnightDays = Array.from({ length: 14 }, (_, index) => ({
  index,
  week: index < 7 ? 'Week 1' : 'Week 2',
  day: dayNames[index % 7]
}));

const houses = [
  { name: 'Tussock', className: 'tussock', shifts: standardShifts() },
  { name: 'Silverglade', className: 'silverglade', shifts: standardShifts() },
  { name: 'Currant', className: 'currant', shifts: standardShifts() },
  { name: '159A Gilston', className: 'gilston-a', shifts: standardShifts() },
  {
    name: '159B Gilston',
    className: 'gilston-b',
    shifts: [
      ...standardShifts(),
      { id: 'shortAM', label: 'Short AM', time: '7:30am - 10:30am', timeClass: 'short-time' },
      { id: 'shortPM', label: 'Short PM', time: '4:30pm - 7:30pm', timeClass: 'short-time' }
    ]
  }
];

let rosterData = {};
let fortnightStart = getMondayDate(new Date());

function standardShifts() {
  return [
    { id: 'day', label: 'Day Shift', time: '7:15am - 3:15pm', timeClass: 'day-time' },
    { id: 'sleepover', label: 'Afternoon / Sleepover', time: '3:15pm - 7:15am', timeClass: 'night-time' }
  ];
}

function loadEmployeeDropdowns() {
  const quickStaff = document.getElementById('quickStaff');
  quickStaff.innerHTML = '<option value="">Select staff name</option>';

  employeeNames.forEach(name => {
    quickStaff.innerHTML += `<option value="${name}">${name}</option>`;
  });
}

function getMondayDate(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  return d.toISOString().split('T')[0];
}

function getDateForDay(index) {
  const d = new Date(fortnightStart);
  d.setDate(d.getDate() + index);
  return d.toLocaleDateString('en-AU', { day: '2-digit', month: '2-digit' });
}

function cellKey(house, shift, dayIndex) {
  return `${fortnightStart}_${house}_${shift}_${dayIndex}`;
}

function getCell(house, shift, dayIndex) {
  const key = cellKey(house, shift, dayIndex);
  if (!rosterData[key]) rosterData[key] = { staff: '', status: 'Vacant', notes: '' };
  return rosterData[key];
}

function setFortnightStart(value) {
  fortnightStart = value;
  saveRoster();
  renderRoster();
}

function statusClass(status) {
  if (status === 'Covered') return 'status-covered';
  if (status === 'Pending') return 'status-pending';
  return 'status-vacant';
}

function renderRoster() {
  document.getElementById('fortnightStart').value = fortnightStart;
  renderCoverList();

  const filter = document.getElementById('houseFilter').value;
  const rosterArea = document.getElementById('rosterArea');
  const visibleHouses = filter === 'All' ? houses : houses.filter(h => h.name === filter);

  rosterArea.innerHTML = visibleHouses.map(house => `
    <article class="house-card">
      <div class="house-header ${house.className}">
        <div>
          <h2>${house.name}</h2>
          <small>Fortnight commencing ${formatFortnightStart()}</small>
        </div>
        <small>${house.shifts.length} shifts per day</small>
      </div>

      <div class="roster-table-wrap">
        <table>
          <thead>
            <tr>
              <th>Shift</th>
              ${fortnightDays.map(day => `<th class="${day.index === 7 ? 'week-break' : ''}">${day.week}<br>${day.day}<br>${getDateForDay(day.index)}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${house.shifts.map(shift => `
              <tr>
                <td>
                  <span class="shift-name">${shift.label}</span>
                  <span class="shift-time ${shift.timeClass}">${shift.time}</span>
                </td>
                ${fortnightDays.map(day => rosterCell(house.name, shift.id, day.index)).join('')}
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>

      <div class="actions">
        <button class="secondary-btn" onclick="copyWeekOneToWeekTwo('${house.name}')">Copy Week 1 to Week 2</button>
        <button class="secondary-btn" onclick="copyMondayToFortnight('${house.name}')">Copy First Monday Across Fortnight</button>
        <button class="secondary-btn" onclick="clearHouse('${house.name}')">Clear ${house.name}</button>
        <button onclick="window.print()">Print / Save PDF</button>
      </div>
    </article>
  `).join('');
}

function rosterCell(house, shift, dayIndex) {
  const cell = getCell(house, shift, dayIndex);
  const key = cellKey(house, shift, dayIndex);
  const weekClass = dayIndex === 7 ? 'week-break' : '';

  return `
    <td class="${weekClass}">
      <div class="cell-box">
        <select onchange="updateCell('${key}', 'staff', this.value); renderRoster();">
          <option value="">Select staff</option>
          ${employeeNames.map(name => `
            <option value="${name}" ${cell.staff === name ? 'selected' : ''}>${name}</option>
          `).join('')}
        </select>

        <select class="${statusClass(cell.status)}" onchange="updateCell('${key}', 'status', this.value); renderRoster();">
          <option ${cell.status === 'Vacant' ? 'selected' : ''}>Vacant</option>
          <option ${cell.status === 'Pending' ? 'selected' : ''}>Pending</option>
          <option ${cell.status === 'Covered' ? 'selected' : ''}>Covered</option>
        </select>

        <input value="${cell.notes}" placeholder="Notes" onchange="updateCell('${key}', 'notes', this.value)" />
      </div>
    </td>
  `;
}

function quickFillStaff(key) {
  const staff = document.getElementById('quickStaff').value.trim();
  if (!staff) return;
  if (!rosterData[key]) rosterData[key] = { staff: '', status: 'Vacant', notes: '' };
  rosterData[key].staff = staff;
  rosterData[key].status = 'Covered';
  saveRoster();
  renderRoster();
}

function updateCell(key, field, value) {
  if (!rosterData[key]) rosterData[key] = { staff: '', status: 'Vacant', notes: '' };
  rosterData[key][field] = value;

  if (field === 'staff' && value.trim()) rosterData[key].status = 'Covered';
  if (field === 'staff' && !value.trim()) rosterData[key].status = 'Vacant';

  saveRoster();
}

function renderCoverList() {
  const coverList = document.getElementById('coverList');
  const coverCount = document.getElementById('coverCount');
  const items = [];

  houses.forEach(house => {
    house.shifts.forEach(shift => {
      fortnightDays.forEach(day => {
        const cell = getCell(house.name, shift.id, day.index);
        if (cell.status === 'Vacant' || !cell.staff.trim()) {
          items.push({
            house: house.name,
            week: day.week,
            day: day.day,
            date: getDateForDay(day.index),
            shift: shift.label,
            time: shift.time,
            status: cell.status
          });
        }
      });
    });
  });

  coverCount.textContent = items.length;

  if (!items.length) {
    coverList.innerHTML = '<div class="empty-cover">All shifts are currently covered.</div>';
    return;
  }

  coverList.innerHTML = items.map(item => `
    <div class="cover-item">
      <strong>${item.house}</strong>
      <span>${item.week} — ${item.day} ${item.date}</span>
      <span>${item.shift}: ${item.time}</span>
      <span>Status: ${item.status}</span>
    </div>
  `).join('');
}

function showTab(tab) {
  const rosterArea = document.getElementById('rosterArea');
  const statsPanel = document.getElementById('statsPanel');
  const coverPanel = document.getElementById('coverPanel');
  const rosterTab = document.getElementById('rosterTab');
  const coverTab = document.getElementById('coverTab');

  if (tab === 'cover') {
    rosterArea.style.display = 'none';
    statsPanel.style.display = 'none';
    coverPanel.classList.add('active');
    coverTab.classList.add('active');
    rosterTab.classList.remove('active');
  } else {
    rosterArea.style.display = 'block';
    statsPanel.style.display = 'grid';
    coverPanel.classList.remove('active');
    rosterTab.classList.add('active');
    coverTab.classList.remove('active');
  }
}

function copyWeekOneToWeekTwo(houseName) {
  const house = houses.find(h => h.name === houseName);
  house.shifts.forEach(shift => {
    for (let i = 0; i < 7; i++) {
      rosterData[cellKey(houseName, shift.id, i + 7)] = { ...getCell(houseName, shift.id, i) };
    }
  });
  saveRoster();
  renderRoster();
}

function copyMondayToFortnight(houseName) {
  const house = houses.find(h => h.name === houseName);
  house.shifts.forEach(shift => {
    const mondayData = { ...getCell(houseName, shift.id, 0) };
    fortnightDays.forEach(day => {
      rosterData[cellKey(houseName, shift.id, day.index)] = { ...mondayData };
    });
  });
  saveRoster();
  renderRoster();
}

function clearHouse(houseName) {
  Object.keys(rosterData).forEach(key => {
    if (key.startsWith(`${fortnightStart}_${houseName}_`)) delete rosterData[key];
  });
  saveRoster();
  renderRoster();
}

function clearRoster() {
  if (!confirm('Clear the current fortnight roster?')) return;
  Object.keys(rosterData).forEach(key => {
    if (key.startsWith(`${fortnightStart}_`)) delete rosterData[key];
  });
  saveRoster();
  renderRoster();
}

function formatFortnightStart() {
  return new Date(fortnightStart).toLocaleDateString('en-AU', {
    weekday: 'long',
    day: '2-digit',
    month: 'long',
    year: 'numeric'
  });
}

function saveRoster() {
  localStorage.setItem('fortnightlyHouseRosterData', JSON.stringify(rosterData));
  localStorage.setItem('fortnightlyHouseRosterStart', fortnightStart);
}

function loadRoster() {
  const savedData = localStorage.getItem('fortnightlyHouseRosterData');
  const savedStart = localStorage.getItem('fortnightlyHouseRosterStart');

  if (savedData) {
    try { rosterData = JSON.parse(savedData); }
    catch { rosterData = {}; }
  }

  if (savedStart) fortnightStart = savedStart;
}

loadRoster();
loadEmployeeDropdowns();
renderRoster();
</script>
</body>
</html>
